name: Build and Verify MohanMart

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build, Test & Verify with Maven
        run: mvn -B clean verify

      - name: Run Static Analysis (Checkstyle & SpotBugs)
        run: mvn -B checkstyle:check spotbugs:check

      - name: Upload Packaged WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mohanmart-war
          path: target/mohanmart.war
          retention-days: 14
